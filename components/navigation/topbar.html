<div class="app-topbar page-header">
  <div class="topbar-left">
    <button class="mobile-toggle" id="mobile-sidebar-toggle" title="Toggle Sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <span class="topbar-page" id="topbar-page-title">Mission Control</span>
    <div class="topbar-search" id="topbar-search-trigger">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Search anything…</span>
      <kbd>⌘K</kbd>
    </div>
  </div>

  <div class="topbar-right">
    <span class="topbar-date" id="topbar-date-display">Sunday, July 27, 2026</span>
    <button class="tb-btn tb-btn-primary" title="Quick Create" id="topbar-quick-create">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <button class="topbar-ai" title="AI Assistant" id="topbar-ai-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span>AI</span>
    </button>

    <!-- Notification Trigger -->
    <div style="position: relative;">
      <button class="tb-btn" title="Notifications" id="topbar-notifications-toggle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="dot"></span>
      </button>

      <!-- Notifications Dropdown -->
      <div class="dropdown-menu" id="notifications-dropdown">
        <div style="padding: 8px 12px; font-weight: 700; border-bottom: 1px solid var(--border-subtle); font-size: 12px;">Notifications</div>
        <div class="dropdown-item">
          <div>
            <div style="font-weight: 600;">System Update</div>
            <div style="font-size: 11px; color: var(--text-3);">VERDE OS v1.0 Framework restored</div>
          </div>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown Trigger -->
    <div style="position: relative;">
      <div class="tb-avatar" id="topbar-profile-toggle">SH</div>
      <div class="dropdown-menu" id="profile-dropdown">
        <div style="padding: 8px 12px; font-weight: 700; border-bottom: 1px solid var(--border-subtle); font-size: 12px;">Shahim (Admin)</div>
        <a href="../auth/index.html" class="dropdown-item" id="topbar-signout">Sign Out</a>
      </div>
    </div>
  </div>
</div>
