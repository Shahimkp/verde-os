<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Project · VERDE OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/modules.css" />
</head>

<body>
  <div class="shell-container">
    <div id="sidebar-container"></div>
    <div class="shell-main">
      <div id="topbar-container"></div>
      <main class="app-content">
        
        <div class="premium-module-layout" style="max-width: 800px; margin: 0 auto;">
          
          <!-- Page Header -->
          <header class="premium-header">
            <div>
              <h1 class="premium-header-title">Create Project</h1>
              <p class="premium-header-desc">Initiate a new project and allocate resources</p>
            </div>
            <div class="premium-toolbar-group">
              <button class="btn btn-ghost" onclick="window.history.back()">Cancel</button>
            </div>
          </header>

          <!-- Main Content: Form -->
          <section class="premium-section">
            <div class="premium-table-container" style="padding: 32px;">
              
              <div class="premium-form-group">
                <label class="premium-label">Project Name</label>
                <input type="text" class="premium-input" placeholder="e.g. Website Redesign 2026" />
              </div>

              <div class="premium-form-group">
                <label class="premium-label">Client</label>
                <select class="premium-input">
                  <option disabled selected>Select a client...</option>
                  <option>Cabo Travels Inc</option>
                  <option>MedCare Health</option>
                  <option>GreenLeaf Corp</option>
                </select>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div class="premium-form-group">
                  <label class="premium-label">Start Date</label>
                  <input type="date" class="premium-input" />
                </div>
                <div class="premium-form-group">
                  <label class="premium-label">Deadline</label>
                  <input type="date" class="premium-input" />
                </div>
              </div>

              <div class="premium-form-group">
                <label class="premium-label">Project Budget (₹)</label>
                <input type="number" class="premium-input" placeholder="0.00" />
              </div>

              <div class="premium-form-group">
                <label class="premium-label">Project Manager</label>
                <select class="premium-input">
                  <option disabled selected>Select a manager...</option>
                  <option>Shahim</option>
                  <option>Midhul K</option>
                  <option>Shafna F</option>
                </select>
              </div>

              <div class="premium-form-actions">
                <button class="btn btn-ghost" onclick="window.history.back()">Discard</button>
                <button class="btn btn-primary" onclick="window.location.href='../projects/index.html'">Create Project</button>
              </div>

            </div>
          </section>

        </div>

      </main>
    </div>
  </div>

  <div id="statusbar-container"></div>
  <div id="overlays-container"></div>

  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="./script.js"></script>
</body>
</html>
