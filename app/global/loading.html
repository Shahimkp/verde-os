<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Loading States · VERDE OS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/global.css" />
<style>


body{font-family:var(--font);background:var(--bg-2);padding:64px;display:flex;flex-direction:column;align-items:center;}

.h2 { font-size:24px; font-weight:800; margin-bottom:8px; color:var(--text-1); text-align:center; }
.desc { font-size:14px; color:var(--text-2); margin-bottom:48px; text-align:center; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:40px; max-width:1000px; width:100%; }
.card { background:var(--bg); border:1px solid var(--border); padding:32px; border-radius:12px; }
.c-label { font-size:11px; font-weight:800; color:var(--text-2); text-transform:uppercase; margin-bottom:24px; }

/* ── SKELETON ANIMATION ── */
.sk { background:var(--bg-2); border-radius:4px; position:relative; overflow:hidden; }
.sk::after { content:''; position:absolute; top:0; right:0; bottom:0; left:0; transform:translateX(-100%); background-image:linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.4) 20%, rgba(255,255,255,0.4) 60%, rgba(255,255,255,0)); animation:shimmer 2s infinite; }
@keyframes shimmer { 100%{transform:translateX(100%)} }

/* Card Skeleton */
.sk-avatar { width:48px; height:48px; border-radius:50%; }
.sk-text { height:16px; width:100%; margin-bottom:8px; }
.sk-text.short { width:60%; }

/* Table Skeleton */
.sk-row { display:flex; gap:16px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.sk-row:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }

/* Chart Skeleton */
.sk-chart { display:flex; align-items:flex-end; gap:8px; height:120px; border-bottom:1px solid var(--border); padding-bottom:8px; }
.sk-bar { width:100%; border-radius:4px 4px 0 0; }

/* Spinners */
.spinner { width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
  <div class="h2">Loading States</div>
  <div class="desc">Shimmer skeletons used to mask latency while fetching data without causing layout shifts.</div>
  
  <div class="grid">
    <div class="card">
      <div class="c-label">Profile / Card Skeleton</div>
      <div style="display:flex; gap:16px; align-items:center;">
        <div class="sk sk-avatar"></div>
        <div style="flex:1;">
          <div class="sk sk-text" style="width:40%;"></div>
          <div class="sk sk-text short" style="margin-bottom:0;"></div>
        </div>
      </div>
      <div style="margin-top:24px; display:flex; gap:16px; align-items:center;">
        <div class="sk sk-avatar"></div>
        <div style="flex:1;">
          <div class="sk sk-text" style="width:50%;"></div>
          <div class="sk sk-text short" style="margin-bottom:0;"></div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <div class="c-label">Table Skeleton</div>
      <div class="sk-row">
        <div class="sk sk-text" style="width:10%; margin:0;"></div>
        <div class="sk sk-text" style="width:40%; margin:0;"></div>
        <div class="sk sk-text" style="width:20%; margin:0;"></div>
        <div class="sk sk-text" style="width:30%; margin:0;"></div>
      </div>
      <div class="sk-row">
        <div class="sk sk-text" style="width:10%; margin:0;"></div>
        <div class="sk sk-text" style="width:30%; margin:0;"></div>
        <div class="sk sk-text" style="width:25%; margin:0;"></div>
        <div class="sk sk-text" style="width:35%; margin:0;"></div>
      </div>
      <div class="sk-row">
        <div class="sk sk-text" style="width:10%; margin:0;"></div>
        <div class="sk sk-text" style="width:45%; margin:0;"></div>
        <div class="sk sk-text" style="width:15%; margin:0;"></div>
        <div class="sk sk-text" style="width:30%; margin:0;"></div>
      </div>
    </div>
    
    <div class="card">
      <div class="c-label">Chart Skeleton</div>
      <div class="sk-chart">
        <div class="sk sk-bar" style="height:40%;"></div>
        <div class="sk sk-bar" style="height:60%;"></div>
        <div class="sk sk-bar" style="height:30%;"></div>
        <div class="sk sk-bar" style="height:80%;"></div>
        <div class="sk sk-bar" style="height:50%;"></div>
        <div class="sk sk-bar" style="height:90%;"></div>
        <div class="sk sk-bar" style="height:70%;"></div>
      </div>
    </div>
    
    <div class="card" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div class="c-label" style="align-self:flex-start;">Action Spinner</div>
      <div class="spinner" style="width:40px; height:40px; border-width:4px;"></div>
      <div style="font-size:13px; color:var(--text-2); margin-top:16px;">Processing...</div>
    </div>
  </div>
</body>
</html>
