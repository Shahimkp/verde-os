<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>User Profile Dropdown · VERDE OS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/global.css" />
<style>


body{font-family:var(--font);background:var(--bg-2);height:100vh;display:flex;align-items:flex-start;justify-content:center;padding-top:100px;}

.demo-btn { background:var(--bg); border:1px solid var(--border); padding:10px 16px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; position:relative; }
.demo-btn:hover { background:var(--bg-2); }

.dropdown { position:absolute; top:calc(100% + 8px); right:0; width:280px; background:var(--bg); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); z-index:100; overflow:hidden; }
.dd-header { padding:20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; background:url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" fill="none"><rect width="100%" height="100%" fill="%23F9FAFB"/></svg>'); background-size:cover; }
.dd-avatar { width:48px; height:48px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; }
.dd-name { font-size:16px; font-weight:800; color:var(--text-1); letter-spacing:-0.5px; }
.dd-email { font-size:12px; color:var(--text-3); font-weight:500; margin-top:2px; }

.dd-stats { display:flex; padding:12px; border-bottom:1px solid var(--border); background:var(--bg); }
.dd-stat { flex:1; text-align:center; border-right:1px solid var(--border); }
.dd-stat:last-child { border-right:none; }
.dd-s-val { font-size:16px; font-weight:800; color:var(--text-1); }
.dd-s-lbl { font-size:11px; font-weight:600; color:var(--text-3); text-transform:uppercase; margin-top:2px; }

.dd-body { padding:8px; }
.dd-item { padding:10px 12px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600; color:var(--text-2); cursor:pointer; border-radius:6px; transition:all 0.2s; }
.dd-item-left { display:flex; align-items:center; gap:12px; }
.dd-item:hover { background:#E8E8F4; color:var(--primary); }
.dd-item svg { width:16px; height:16px; color:var(--text-3); }
.dd-item:hover svg { color:var(--primary); }
.dd-divider { height:1px; background:var(--border); margin:4px 0; }
.dd-danger { color:var(--danger); }
.dd-danger:hover { background:#FEE2E2; color:var(--danger); }
.dd-danger:hover svg { color:var(--danger); }

.dd-badge { background:var(--success); color:#fff; font-size:10px; font-weight:800; padding:2px 6px; border-radius:99px; }
</style>
</head>
<body>

<div class="demo-btn">
  My Account
  <div class="dropdown">
    <div class="dd-header">
      <div class="dd-avatar">MD</div>
      <div>
        <div class="dd-name">Managing Director</div>
        <div class="dd-email">md@verdelabs.com</div>
      </div>
    </div>
    
    <div class="dd-stats">
      <div class="dd-stat"><div class="dd-s-val">8</div><div class="dd-s-lbl">Hours</div></div>
      <div class="dd-stat"><div class="dd-s-val">12</div><div class="dd-s-lbl">Tasks</div></div>
      <div class="dd-stat"><div class="dd-s-val">98%</div><div class="dd-s-lbl">Score</div></div>
    </div>
    
    <div class="dd-body">
      <div class="dd-item">
        <div class="dd-item-left"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg> My Profile</div>
      </div>
      <div class="dd-item">
        <div class="dd-item-left"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Preferences</div>
      </div>
      <div class="dd-item">
        <div class="dd-item-left"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Theme</div>
      </div>
      <div class="dd-divider"></div>
      <div class="dd-item">
        <div class="dd-item-left"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Workspace</div>
        <div class="dd-badge">VERDE LABS</div>
      </div>
      <div class="dd-item">
        <div class="dd-item-left"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Security Logs</div>
      </div>
      <div class="dd-divider"></div>
      <div class="dd-item dd-danger">
        <div class="dd-item-left"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
