<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internal Chat · VERDE OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/modules.css" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="shell-container">
    <div id="sidebar-container"></div>
    <div class="shell-main">
      <div id="topbar-container"></div>
      <main class="app-content">
        <header class="chat-page-header">
          <div>
            <h1 class="chat-page-title">Internal Chat</h1>
            <div class="chat-page-desc">Communication hub for VERDE OS</div>
          </div>
        </header>

        <div class="chat-layout fade-up">
          <div class="chat-sidebar">
            <div class="chat-sidebar-header">
              <div class="chat-search">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  style="color:var(--text-3)">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="chat-search-input" placeholder="Search members..."
                  oninput="ChatModule.filterMembers(this.value)">
              </div>
            </div>
            <div class="chat-list" id="chat-members-list">
              <!-- Rendered via JS -->
            </div>
          </div>
          <div class="chat-main" id="chat-main-area">
            <div class="chat-empty-state">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                </path>
              </svg>
              <span>Select a conversation to start chatting</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="statusbar-container"></div>
  <div id="overlays-container"></div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/permissions.js"></script>
  <script src="../assets/js/services.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="./script.js"></script>
</body>

</html>
